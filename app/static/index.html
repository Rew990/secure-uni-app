<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secure University Records</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Secure University Records</h1>
    <div id="who" hidden>
      <span id="who-text"></span>
      <button id="logout" class="secondary">Log out</button>
    </div>
  </header>

  <main>
    <!-- 1. Login: shown until the user has a token -->
    <section id="login-view" class="card narrow">
      <h2>Log in</h2>
      <form id="login-form">
        <label>Username <input name="username" autocomplete="username" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <label id="totp-row" hidden>6-digit code from your authenticator app
          <input name="totp_code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}">
        </label>
        <button type="submit">Log in</button>
        <p id="login-error" class="error"></p>
      </form>
    </section>

    <!-- 2. Dashboard: each card is shown only to the roles that may use it -->
    <section id="app-view" hidden>
      <p id="message" class="message" hidden></p>

      <div class="card" data-roles="student">
        <h2>My record</h2>
        <dl id="my-record" class="record"></dl>
      </div>

      <div class="card" data-roles="admin instructor">
        <h2>Students</h2>
        <p class="hint" data-roles="instructor">Type a new GPA and press Save to change a grade.</p>
        <table id="students-table"></table>
      </div>

      <div class="card" data-roles="admin">
        <h2>Add a student</h2>
        <form id="student-form" class="grid">
          <label>Student number <input name="student_number" required></label>
          <label>Full name <input name="full_name" required></label>
          <label>National ID <input name="national_id"></label>
          <label>Birth year <input name="birth_year" type="number" min="1900" max="2100" required></label>
          <label>Gender
            <select name="gender"><option>F</option><option>M</option></select>
          </label>
          <label>ZIP code <input name="zip_code" required></label>
          <label>Department <input name="department" required></label>
          <label>GPA <input name="gpa" type="number" min="0" max="4" step="0.01" required></label>
          <button type="submit">Add student</button>
        </form>
      </div>

      <div class="card" data-roles="instructor student">
        <h2>Course material</h2>
        <form id="upload-form" class="inline" data-roles="instructor">
          <input name="title" placeholder="Title" required>
          <input name="file" type="file" accept=".pdf,.pptx,.docx" required>
          <button type="submit">Upload</button>
        </form>
        <table id="materials-table"></table>
      </div>

      <div class="card" data-roles="admin instructor">
        <h2>Anonymised dataset</h2>
        <table id="anon-table"></table>
      </div>

      <div class="card" data-roles="admin">
        <h2>User accounts</h2>
        <table id="users-table"></table>
        <form id="user-form" class="inline">
          <input name="username" placeholder="Username" minlength="3" required>
          <input name="password" type="password" placeholder="Password (8+ chars)" minlength="8" required>
          <select name="role">
            <option value="student">student</option>
            <option value="instructor">instructor</option>
            <option value="admin">admin</option>
          </select>
          <button type="submit">Create user</button>
        </form>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
